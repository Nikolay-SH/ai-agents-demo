demo.role=${DEMO_ROLE:checkout}
demo.payment-url=${DEMO_PAYMENT_URL:http://localhost:18082}
demo.jdbc-url=${DEMO_JDBC_URL:jdbc:postgresql://localhost:15432/sherlock?connectTimeout=2&socketTimeout=5&ApplicationName=payment}
demo.db-user=${DEMO_DB_USER:sherlock}
demo.db-password=${DEMO_DB_PASSWORD:sherlock-demo}
spring.application.name=${demo.role}
server.port=8080
server.tomcat.connection-timeout=5s
spring.lifecycle.timeout-per-shutdown-phase=5s
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${demo.role}
info.app.version=0.1.0
management.metrics.tags.application=${demo.role}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=10ms,50ms,100ms,250ms,500ms,1s,2s,5s
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n
